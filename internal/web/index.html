<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whydah</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --surface: #ffffff; --border: #e3e2de; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #2f6fdf; --accent-text: #ffffff; --ok: #1f8a4c; --err: #c4352b; --warn-bg: #fff6e0; --warn: #8a5a00;
    --track: #ecebe7; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1e; --border: #33322f; --text: #ecebe8; --muted: #9a9893;
      --accent: #5b8ff0; --accent-text: #0d0d0c; --ok: #4cc27c; --err: #f0675c; --warn-bg: #3a2e12; --warn: #f2c66b;
      --track: #2c2b29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  header h1 .logo { border-radius: 6px; display: block; }
  button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; }
  button.link:hover { color: var(--text); }
  input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
                  border-radius: 8px; padding: 8px 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; background: var(--warn-bg); color: var(--warn); }
  .banner.error { color: var(--err); }
  .banner.info { background: var(--surface); color: var(--text); border: 1px solid var(--accent); }
  .banner .actions { margin-top: 8px; }
  .hint-update { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .hint-update button { margin-left: 4px; padding: 2px 8px; font-size: 13px; }
  .footer button.link { font-size: 12px; text-decoration: underline; }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  form.url { display: flex; gap: 8px; margin-bottom: 8px; }
  form.url input { flex: 1; min-width: 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px;
       display: flex; align-items: center; justify-content: space-between; }
  .stack { display: grid; gap: 10px; }
  .preview { display: grid; grid-template-columns: 160px 1fr; gap: 14px; align-items: start; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--track); display: block; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .error-text { color: var(--err); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error-detail { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .error-detail summary { cursor: pointer; width: fit-content; }
  .error-detail div { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 4px; }
  .job { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; }
  .job .thumb { aspect-ratio: 16/9; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.2s infinite ease-in-out; }
  .bar.done > div { background: var(--ok); }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .badge { font-size: 12px; font-weight: 600; }
  .badge.done { color: var(--ok); } .badge.error { color: var(--err); } .badge.canceled { color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);
           padding: 20px; width: min(480px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 14px; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field > * { min-width: 0; } /* a long option (in some languages) mustn't widen the dialog */
  .field label { font-size: 13px; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .footer { color: var(--muted); font-size: 12px; margin-top: 40px; text-align: center; }
  .field .example { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .field .example code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bookmarklet { display: inline-block; padding: 6px 12px; border: 1px dashed var(--accent); border-radius: 8px; color: var(--accent);
                 text-decoration: none; font-weight: 600; cursor: grab; }
  #history { width: min(720px, calc(100vw - 32px)); }
  #history-q { width: 100%; box-sizing: border-box; }
  #history-list { display: grid; gap: 2px; max-height: min(60vh, 560px); overflow-y: auto; margin-top: 10px; }
  .past { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 6px; }
  .past:hover { background: var(--track); }
  .past .thumb { aspect-ratio: 16/9; width: 72px; }
  .past .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .past .meta { font-size: 12px; }
  .past .actions { margin-top: 0; flex-wrap: nowrap; }
  .past .actions button { padding: 2px 8px; font-size: 13px; }
  .items { grid-column: 1 / -1; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 8px;
           max-height: 360px; overflow-y: auto; }
  .items-head { display: flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); padding-bottom: 4px; }
  .item { display: grid; grid-template-columns: auto 3ch 1fr auto; gap: 8px; align-items: center; padding: 5px 2px;
          font-size: 14px; border-radius: 6px; }
  .item.no-check { grid-template-columns: 3ch 1fr auto auto; }
  .item.with-thumb { grid-template-columns: auto 3ch 96px 1fr auto; }
  .row-thumb { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--track); display: block; }
  img.row-thumb { cursor: zoom-in; }
  .item:hover { background: var(--track); }
  .item .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .status.error { color: var(--err); } .item .status.done { color: var(--ok); }
  .item button { padding: 2px 8px; font-size: 13px; }
  .photos { grid-column: 1 / -1; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 8px; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px;
                max-height: 440px; overflow-y: auto; padding: 2px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--track);
          cursor: pointer; outline: 2px solid transparent; outline-offset: -2px; }
  .tile.on { outline-color: var(--accent); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile:not(.on) img { opacity: .35; }
  .tile input { position: absolute; top: 6px; left: 6px; margin: 0; }
  .tile .zoom { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; padding: 0; border: none; border-radius: 14px;
    background: rgba(0, 0, 0, .6); color: #fff; font-size: 15px; line-height: 28px; opacity: 0; cursor: zoom-in; }
  .tile:hover .zoom, .tile .zoom:focus-visible { opacity: 1; }
  @media (hover: none) { .tile .zoom { opacity: 1; } }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .88); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 56px 16px 16px; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 130px); object-fit: contain; border-radius: 6px; }
  .lightbox .lb-cap { color: #eee; font-size: 14px; text-align: center; padding: 12px 8px 0; max-width: 60em; overflow-wrap: anywhere; }
  .lightbox .lb-cap span { color: #aaa; }
  .lightbox .lb-btn { position: absolute; width: 44px; height: 44px; padding: 0; border: none; border-radius: 22px;
    background: rgba(255, 255, 255, .14); color: #fff; font-size: 24px; line-height: 44px; }
  .lightbox .lb-btn:hover { background: rgba(255, 255, 255, .26); }
  .lightbox .lb-btn:disabled { opacity: .25; }
  .lb-close { top: 10px; right: 10px; } .lb-prev { left: 10px; top: calc(50% - 22px); } .lb-next { right: 10px; top: calc(50% - 22px); }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 6px; font-size: 11px;
               background: rgba(0, 0, 0, .55); color: #fff; font-variant-numeric: tabular-nums;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .video { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) {
    .preview { grid-template-columns: 1fr; }
    .job { grid-template-columns: 64px 1fr; }
    .job .job-actions { grid-column: 1 / -1; justify-self: end; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><img class="logo" src="/icon.png" alt="" width="28" height="28">Whydah</h1>
    <button class="link" id="open-folder" type="button" data-t="ui.open_hold" data-t-title="ui.open_hold_tip">Open the hold</button>
    <button class="link" id="open-history" type="button" data-t="ui.history">History</button>
    <button class="link" id="open-settings" type="button" data-t="ui.settings">Settings</button>
    <button class="link" id="quit" type="button" data-t="ui.quit">Quit</button>
  </header>

  <div id="tools-banner" class="banner" hidden></div>
  <div id="update-banner" class="banner info" hidden></div>
  <div id="self-banner" class="banner info" hidden></div>

  <form class="url" id="url-form">
    <input id="url-input" type="url" data-t-placeholder="ui.link_placeholder" autocomplete="off" required>
    <button class="primary" type="submit" data-t="ui.spyglass" data-t-title="ui.spyglass_tip">Spyglass</button>
  </form>
  <p class="hint" id="clip-hint"></p>

  <div id="previews" class="stack"></div>

  <h2><span data-t="ui.hold">The hold</span> <button class="link" id="clear" type="button" data-t="ui.clear_finished">Clear finished</button></h2>
  <div id="jobs" class="stack"></div>

  <div class="footer" id="footer"></div>
</main>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h3 data-t="ui.settings">Settings</h3>
    <div class="field"><label for="s-lang" data-t="ui.language">Language</label><select id="s-lang"></select></div>
    <div class="field"><label for="s-out" data-t="ui.download_folder">Download folder</label><input id="s-out" required></div>
    <div class="field"><label for="s-quality" data-t="ui.video_quality">Video quality</label><select id="s-quality"></select></div>
    <label class="check"><input type="checkbox" id="s-compat"> <span data-t="ui.compat">Prefer MP4 / H.264 (plays everywhere; caps most sites at 1080p)</span></label>
    <div class="field"><label for="s-audio" data-t="ui.audio_format">Audio format</label><select id="s-audio"></select></div>
    <div class="field">
      <label for="s-names" data-t="ui.names">File names</label>
      <input id="s-names" autocomplete="off" spellcheck="false">
      <div class="example" id="s-names-example"></div>
    </div>
    <div class="field">
      <label for="s-browser" data-t="ui.cookies_from">Use cookies from browser (for age-restricted, members-only or private posts)</label>
      <select id="s-browser"></select>
      <div id="s-signin" hidden>
        <div class="example" id="s-signin-hint"></div>
        <div class="actions" style="margin-top: 6px">
          <button type="button" id="s-signin-open" data-t="ui.signin">Sign in to sites…</button>
          <button type="button" class="link" id="s-signout" data-t="ui.signout">Sign out of everything</button>
        </div>
        <div class="example" id="s-signin-status"></div>
        <div class="error-text" id="s-signin-error"></div>
      </div>
    </div>
    <div class="field"><label for="s-conc" data-t="ui.simultaneous">Simultaneous downloads</label><input id="s-conc" type="number" min="1" max="8"></div>
    <label class="check"><input type="checkbox" id="s-clip"> <span data-t="ui.watch_clipboard">Watch clipboard for links</span></label>
    <div class="field"><label for="s-hosts" data-t="ui.watch_sites">Sites to watch for (comma separated)</label><input id="s-hosts"></div>
    <div class="field">
      <label for="s-channel" data-t="ui.channel">yt-dlp updates (gallery-dl always uses its latest build)</label>
      <select id="s-channel">
        <option value="stable" data-t="ui.channel_stable">Stable releases</option>
        <option value="nightly" data-t="ui.channel_nightly">Nightly builds (site fixes sooner, occasionally buggy)</option>
      </select>
    </div>
    <div class="field">
      <label data-t="ui.bookmarklet">Browser button</label>
      <div><a class="bookmarklet" id="s-bookmarklet" href="#" data-t="ui.bookmarklet_link">⚓ Salvage with Whydah</a></div>
      <div class="example" data-t="ui.bookmarklet_hint">Drag it to your browser's bookmarks bar. Clicking it on any page opens that page here.</div>
    </div>
    <div class="error-text" id="s-error"></div>
    <div class="row-end">
      <button type="button" id="s-cancel" data-t="ui.cancel">Cancel</button>
      <button class="primary" type="submit" id="s-save" data-t="ui.save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="history">
  <h3 data-t="ui.history">History</h3>
  <input id="history-q" type="search" autocomplete="off" spellcheck="false">
  <div class="meta" id="history-count" style="margin-top: 8px"></div>
  <div id="history-list"></div>
  <div class="row-end">
    <button type="button" class="link" id="history-clear" data-t="ui.history_clear">Clear history</button>
    <button type="button" id="history-close" data-t="ui.close">Close</button>
  </div>
</dialog>

<script>
"use strict";
const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const $ = (id) => document.getElementById(id);
const state = { settings: null, jobs: new Map(), tools: null, previews: new Map(), expandedGroups: new Set() };

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(path, {
    method,
    headers: { "X-Token": token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { problem: data.problem });
  return data;
}

// ---- language ----
// Messages come from the app (internal/i18n/locales), in the language set in
// Settings or else the browser's. t(key, args) fills in {name}; with a count
// argument it picks the key's plural form by the language's rules. All the
// page's text is in the catalog: what's built here calls t(), and elements
// marked data-t (their text), data-t-title and data-t-placeholder are filled
// in by loadMessages.
const i18n = { lang: "en", auto: "en", languages: [], messages: {} };

async function loadMessages() {
  Object.assign(i18n, await api(`/api/i18n?lang=${encodeURIComponent(navigator.languages.join(","))}`));
  document.documentElement.lang = i18n.lang;
  for (const n of document.querySelectorAll("[data-t]")) n.textContent = t(n.dataset.t);
  for (const n of document.querySelectorAll("[data-t-title]")) n.title = t(n.dataset.tTitle);
  for (const n of document.querySelectorAll("[data-t-placeholder]")) n.placeholder = t(n.dataset.tPlaceholder);
}

function t(key, args = {}) {
  let msg = i18n.messages[key];
  if (args.count !== undefined) {
    const form = new Intl.PluralRules(i18n.lang).select(Number(args.count));
    msg = i18n.messages[`${key}.${form}`] ?? i18n.messages[`${key}.other`] ?? msg;
  }
  if (msg === undefined) return key;
  return msg.replace(/\{(\w+)\}/g, (m, name) => (args[name] ?? m));
}

// problemText is an explained failure (from the app) as a sentence or two.
const problemText = (p) => [t(p.key, p.args), p.hint ? t(p.hint, p.args) : ""].filter(Boolean).join(" ");

// problemView shows a failure explained, with what the tool said under
// "Details" when that says more; plain text for anything else.
function problemView(problem, fallback) {
  if (!problem) return el("div", { class: "error-text" }, fallback || "");
  const text = problemText(problem);
  return el("div", {}, el("div", { class: "error-text" }, text),
    problem.detail && problem.detail !== text
      ? el("details", { class: "error-detail" }, el("summary", {}, t("ui.details")), el("div", {}, problem.detail)) : null);
}

function el(tag, props = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") { if (v) n.className = v; }
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null) n.append(c);
  return n;
}

// lightbox shows items[start] ({src, title, detail}) large over the page.
// Arrow keys or ‹ › step through the rest; Esc, × or a click outside closes it.
function lightbox(items, start) {
  if (!items.length) return;
  let i = Math.max(0, start);
  const img = el("img", { alt: "", referrerpolicy: "no-referrer" });
  const cap = el("div", { class: "lb-cap" });
  const btn = (cls, label, text, onclick) => el("button", { class: `lb-btn ${cls}`, type: "button", "aria-label": label,
    onclick: (ev) => { ev.stopPropagation(); onclick(); } }, text);
  const step = (d) => { if (items[i + d]) { i += d; show(); } };
  const prev = btn("lb-prev", t("ui.previous"), "‹", () => step(-1));
  const next = btn("lb-next", t("ui.next"), "›", () => step(1));
  const closeBtn = btn("lb-close", t("ui.close"), "×", () => close());
  const show = () => {
    const it = items[i];
    img.src = it.src; img.alt = it.title || "";
    cap.replaceChildren(it.title || "", el("span", {}, [it.detail, items.length > 1 && t("ui.n_of_total", { index: i + 1, total: items.length })].filter(Boolean).map((s) => `  ·  ${s}`).join("")));
    prev.disabled = i === 0; next.disabled = i === items.length - 1;
    prev.hidden = next.hidden = items.length < 2;
  };
  const onKey = (ev) => {
    if (ev.key === "Escape") close();
    else if (ev.key === "ArrowLeft") step(-1);
    else if (ev.key === "ArrowRight") step(1);
    else return;
    ev.preventDefault();
  };
  const back = document.activeElement;
  const box = el("div", { class: "lightbox", role: "dialog", "aria-modal": "true", "aria-label": t("ui.enlarged_image"),
    onclick: (ev) => { if (ev.target === box || ev.target === cap) close(); } }, img, cap, prev, next, closeBtn);
  function close() { box.remove(); document.removeEventListener("keydown", onKey); if (back) back.focus(); }
  document.body.append(box);
  document.addEventListener("keydown", onKey);
  show();
  closeBtn.focus();
}

// enlarge opens the lightbox from a click inside a <label> without ticking its checkbox.
const enlarge = (items, i) => (ev) => { ev.preventDefault(); ev.stopPropagation(); lightbox(items, i); };

// imgSrc is how this page loads an image found on page: through Whydah
// when the sign-in browser is the cookie source, since this browser isn't
// signed in to the site; directly otherwise.
function imgSrc(src, page) {
  const si = state.signin || {};
  if (!src || !page || !/^https?:/.test(src) || state.settings.browser_cookies !== "whydah" || !si.profile) return src;
  return `/api/image?t=${encodeURIComponent(token)}&u=${encodeURIComponent(src)}&page=${encodeURIComponent(page)}`;
}

// thumb shows src, an image found on page (if known; see imgSrc).
function thumb(src, page) {
  const img = el("img", { class: "thumb", alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
  if (src) img.src = imgSrc(src, page);
  img.addEventListener("error", () => img.removeAttribute("src"));
  return img;
}

const fmtBytes = (n) => {
  if (!n) return "";
  const u = [t("ui.unit_b"), t("ui.unit_kb"), t("ui.unit_mb"), t("ui.unit_gb")]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  const digits = i > 1 ? 1 : 0;
  return `${n.toLocaleString(i18n.lang, { minimumFractionDigits: digits, maximumFractionDigits: digits })} ${u[i]}`;
};
const fmtEta = (s) => s > 0 ? (s >= 3600 ? t("ui.hours_minutes", { h: Math.floor(s/3600), m: Math.floor(s%3600/60) })
  : s >= 60 ? t("ui.minutes_seconds", { m: Math.floor(s/60), s: s%60 }) : t("ui.seconds", { s })) : "";
const fmtPercent = (p) => (Math.floor(p) / 100).toLocaleString(i18n.lang, { style: "percent" });

// ---- tools banner ----
function renderTools() {
  const tools = state.tools, b = $("tools-banner");
  if (!tools) return;
  b.replaceChildren(); b.classList.toggle("error", !!tools.error);
  if (tools.error) b.append(problemView(tools.error));
  else if (!tools.ready || tools.stage) b.append(tools.stage ? problemText(tools.stage) : t("ui.getting_ready")); // also e.g. fetching headless Chrome later
  if (tools.warnings && tools.warnings.length) b.append(el("ul", {}, tools.warnings.map((w) => el("li", {}, problemView(w)))));
  b.hidden = tools.ready && !tools.stage && !tools.error && !(tools.warnings && tools.warnings.length);
  renderUpdate();
}

// ---- tool updates ("refit") ----
// The server checks for new releases of the tools it manages; installing only happens when asked.
const dismissKey = "wd.dismissedUpdate";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode etc. */ } },
};
let seenInstalled = "";

function installUpdate() {
  api("/api/tools/update", { method: "POST" }).catch((e) => alert(e.message));
}

const pendingText = (u) => (u.pending || []).map((p) => `${p.tool} ${p.current} → ${p.latest}`).join(", ");
const pendingKey = (u) => (u.pending || []).map((p) => p.tool + "@" + p.latest).join(",");
const gdlRelease = (v) => (v || "").split(":")[0];

// Failures a newer yt-dlp or gallery-dl won't fix: the site's answer, not how it's read.
const notToolFaults = new Set(["error.not_found", "error.geo_blocked", "error.private", "error.members_only", "error.drm",
  "error.unavailable", "error.not_started", "error.network", "error.timeout", "error.disk_full", "error.cookies_blocked",
  "error.output_folder", "error.rate_limited", "error.linked_none"]);

// updateHint offers a refit on a failure, when there's one to install and it might help.
function updateHint(problem) {
  const u = state.tools && state.tools.update;
  if (!u || !u.available || (problem && notToolFaults.has(problem.key))) return null;
  return el("div", { class: "hint-update" }, t("ui.update_may_fix"),
    el("button", { type: "button", onclick: installUpdate, title: t("ui.refit_tip") }, t("ui.refit")));
}

function renderUpdate() {
  const tools = state.tools, b = $("update-banner"), f = $("footer");
  const u = tools && tools.update;
  f.replaceChildren();
  if (!tools || !tools.yt_dlp_version) { b.hidden = true; renderSelfUpdate(); return; }

  // Footer: versions, channel, and a manual check.
  if (meta.version) f.append(`${t("ui.whydah_version", { version: meta.version })} · `);
  f.append(`yt-dlp ${tools.yt_dlp_version}`);
  if (u.supported) f.append(` (${u.channel || state.settings?.update_channel || "stable"})`);
  if (tools.gallery_dl_version) f.append(` · gallery-dl ${gdlRelease(tools.gallery_dl_version)}`);
  if (tools.headless_version) f.append(` · headless Chrome ${tools.headless_version}`);
  else if (tools.browser) f.append(` · ${t("ui.footer_crows_nest", { browser: tools.browser })}`);
  if (u.supported) {
    f.append(" · ");
    if (u.state === "checking") f.append(t("ui.checking_updates"));
    else if (u.state) f.append(t("ui.refitting"));
    else {
      if (u.check_error) f.append(`${t("ui.check_failed")} · `);
      else if (u.checked_at && !u.available && !u.checked_at.startsWith("0001")) f.append(`${t("ui.up_to_date")} · `);
      f.append(el("button", { class: "link", type: "button", onclick: checkAll }, t("ui.check_updates")));
    }
  }

  // Banner: in-progress, failure, success, or available (unless dismissed for these versions).
  const btn = (label, onclick, cls) => el("button", { type: "button", class: cls, onclick }, label);
  let content = null;
  if (u.state === "waiting") content = [t("ui.refit_waiting")];
  else if (u.state === "installing") content = [t("ui.refit_installing"), el("div", { class: "bar indeterminate" }, el("div"))];
  else if (u.error) content = [problemView(u.error), el("div", { class: "actions" }, btn(t("ui.try_again"), installUpdate))];
  else if (u.installed && u.installed !== seenInstalled) {
    // Offer to retry failures rather than doing it automatically: some (private
    // videos, region blocks) won't be fixed by an update and would just fail again.
    const failed = [...state.jobs.values()].filter((j) => j.state === "error");
    const ack = () => { seenInstalled = u.installed; renderUpdate(); };
    const retryAll = () => { failed.forEach((j) => post(`/api/jobs/${j.id}/retry`)); ack(); };
    content = [t("ui.refit_done", { versions: u.installed }) + (failed.length ? " " + t("ui.refit_may_work") : ""),
      el("div", { class: "actions" },
        failed.length ? btn(t("ui.retry_n_failed", { count: failed.length }), retryAll, "primary") : null,
        btn(failed.length ? t("ui.not_now") : t("ui.ok"), ack))];
  } else if (u.available && store.get(dismissKey) !== pendingKey(u)) {
    content = [t("ui.update_available", { pending: pendingText(u) }),
      el("div", { class: "actions" },
        btn(t("ui.refit_now"), installUpdate, "primary"),
        btn(t("ui.not_now"), () => { store.set(dismissKey, pendingKey(u)); renderUpdate(); }))];
  }
  b.replaceChildren(...(content || []));
  b.hidden = !content;
  renderSelfUpdate();
}

// checkAll looks for new releases of the tools and of Whydah itself.
function checkAll() {
  Promise.all([
    api("/api/tools/check", { method: "POST" }).then((s) => { state.tools = s; }),
    api("/api/self-update/check", { method: "POST" }).then((s) => { state.self = s; }),
  ]).then(() => { renderTools(); renderJobs(); }).catch((e) => alert(e.message));
}

// ---- Whydah's own updates ----
// The server checks daily for a new release; installing happens when asked,
// and Whydah restarts as the new version. The page reloads when it sees a
// different version (loadState).
const selfDismissKey = "wd.dismissedSelfUpdate";

function installSelfUpdate() {
  api("/api/self-update", { method: "POST" }).then((s) => { state.self = s; renderSelfUpdate(); }).catch((e) => alert(e.message));
}

function renderSelfUpdate() {
  const u = state.self, b = $("self-banner");
  const btn = (label, onclick, cls) => el("button", { type: "button", class: cls, onclick }, label);
  const notes = () => btn(t("ui.selfupdate_notes"), () => window.open(u.release_url, "_blank", "noopener"), "link");
  let content = null;
  if (u && u.supported) {
    if (u.state === "installing" || u.state === "restarting") {
      content = [u.state === "installing" ? t("ui.selfupdate_installing") : t("ui.selfupdate_restarting"), el("div", { class: "bar indeterminate" }, el("div"))];
    } else if (u.error) {
      content = [problemView(u.error), el("div", { class: "actions" }, btn(t("ui.try_again"), installSelfUpdate), u.release_url ? notes() : null)];
    } else if (u.available && store.get(selfDismissKey) !== u.latest) {
      const running = [...state.jobs.values()].some((j) => j.state === "downloading" || j.state === "processing");
      content = [t("ui.selfupdate_available", { latest: u.latest, current: u.current }) + (running ? " " + t("ui.selfupdate_resume") : ""),
        el("div", { class: "actions" },
          btn(t("ui.selfupdate_install"), installSelfUpdate, "primary"), notes(),
          btn(t("ui.not_now"), () => { store.set(selfDismissKey, u.latest); renderSelfUpdate(); }))];
    }
  }
  b.replaceChildren(...(content || []));
  b.hidden = !content;
}

// ---- previews ----
// Preview cards are built once per status and cached on the preview (p.el), so
// ticking checkboxes or a new preview arriving doesn't reset a list's scroll.
// mode is "" (anything), "photos" (skip the video lookup) or "crow" (the
// crow's nest: load the page in a hidden browser). Previews are keyed by
// URL, or mode + ":" + URL.
async function inspect(url, mode = "") {
  url = url.trim();
  const key = mode ? `${mode}:${url}` : url;
  if (!url || state.previews.has(key)) return;
  const photos = mode !== "";
  state.previews.set(key, { status: "loading", url, mode, photos });
  renderPreviews();
  try {
    const md = await api("/api/inspect", { method: "POST", body: { url, photos: mode === "photos", crows_nest: mode === "crow" } });
    if (state.previews.has(key)) {
      const selected = new Set((md.photos || md.entries || []).map((e) => e.index));
      state.previews.set(key, { status: "ready", url, mode, photos, md, selected, expanded: false });
    }
  } catch (e) {
    if (state.previews.has(key)) state.previews.set(key, { status: "error", url, mode, photos, error: e.message, problem: e.problem });
  }
  renderPreviews();
}

// checkLinks runs yt-dlp on the pages a result's thumbnails link to; the
// ones with a video come back as a playlist. Progress arrives as links_progress events.
async function checkLinks(url, md) {
  const key = `links:${url}`;
  if (state.previews.has(key)) return;
  const links = md.links;
  state.previews.set(key, { status: "loading", url, mode: "links", links, title: md.title, done: 0 });
  renderPreviews();
  try {
    const pl = await api("/api/check-links", { method: "POST", body: { url, title: md.title, links } });
    if (state.previews.has(key)) {
      state.previews.set(key, { status: "ready", url, mode: "links", links, title: md.title, md: pl, selected: new Set(pl.entries.map((e) => e.index)), expanded: true });
    }
  } catch (e) {
    if (state.previews.has(key)) state.previews.set(key, { status: "error", url, mode: "links", links, title: md.title, photos: true, error: e.message, problem: e.problem });
  }
  renderPreviews();
}

function linksProgress(d) {
  const p = state.previews.get(`links:${d.url}`);
  if (!p || p.status !== "loading") return;
  p.done = d.done;
  if (p.bar) p.bar.style.width = `${(100 * d.done / Math.max(d.total, 1)).toFixed(0)}%`;
  if (p.count) p.count.textContent = t("ui.links_checked", { done: d.done, total: d.total });
}

const linkedBtn = (url, md, cls) => el("button", { class: cls, type: "button", onclick: () => checkLinks(url, md),
  title: t("ui.linked_tip") }, t("ui.linked_videos", { count: md.links.length }));

const crowsNestBtn = (url, cls) => el("button", { class: cls, type: "button", onclick: () => inspect(url, "crow"), title: t("ui.crows_nest_tip") }, t("ui.crows_nest"));

function dismiss(key) { state.previews.delete(key); renderPreviews(); }

const audioLabel = () => (state.settings ? state.settings.audio_format : "mp3");

async function startDownload(key, audio) {
  const p = state.previews.get(key), md = p.md;
  dismiss(key);
  try {
    upsertJob(await api("/api/download", { method: "POST", body: { url: p.url, audio, title: md.title, thumbnail: md.thumbnail } }));
  } catch (e) { alert(e.message); }
}

// A stream the crow's nest caught downloads with the Referer its player sent.
async function startStream(key, st, audio) {
  const page = state.previews.get(key).url;
  dismiss(key);
  try {
    upsertJob(await api("/api/download", { method: "POST", body: {
      url: st.url, audio, title: st.title, thumbnail: st.thumbnail, referer: st.referer, origin: st.origin, page } }));
  } catch (e) { alert(e.message); }
}

const streamKind = (kind) => ({ hls: t("ui.stream_hls"), dash: t("ui.stream_dash"), video: t("ui.stream_video"), audio: t("ui.stream_audio") })[kind];
const streamMeta = (st) => [streamKind(st.kind), st.live ? t("ui.live") : st.duration ? st.duration_string : "",
  st.height ? `${st.height}p` : "", st.filesize ? `~${fmtBytes(st.filesize)}` : ""].filter(Boolean).join(" · ");

// streamsBtn opens a result's streams as a card of their own, next to its photos or linked videos.
const streamsBtn = (url, md, cls) => el("button", { class: cls, type: "button",
  onclick: () => {
    const key = `streams:${url}`;
    if (state.previews.has(key)) return;
    state.previews.set(key, { status: "ready", url, mode: "streams", md: { ...md, kind: "streams" } });
    renderPreviews();
  }, title: t("ui.streams_tip") }, t("ui.streams_button", { count: md.streams.length }));

// photosBtn opens a streams result's photos (its poster, say) as a photo card.
const photosBtn = (url, md) => el("button", { class: "link", type: "button",
  onclick: () => {
    const key = `photos-of:${url}`;
    if (state.previews.has(key)) return;
    state.previews.set(key, { status: "ready", url, mode: "photos", photos: true, md: { ...md, kind: "photos" },
      selected: new Set(md.photos.map((ph) => ph.index)), expanded: true });
    renderPreviews();
  } }, t("ui.photos_button", { count: md.photos.length }));

function streamsCard(key, p) {
  const md = p.md, streams = md.streams, first = streams[0];
  const isAudio = (st) => st.kind === "audio";
  const buttons = (st, cls) => [
    isAudio(st) ? null : el("button", { class: cls, type: "button", onclick: () => startStream(key, st, false) }, t("ui.salvage_video")),
    el("button", { class: isAudio(st) ? cls : "", type: "button", onclick: () => startStream(key, st, true) }, t("ui.salvage_audio", { format: audioLabel() }))];
  const dismissBtn = el("button", { class: "link", type: "button", onclick: () => dismiss(key) }, t("ui.dismiss"));
  const more = [md.photos && md.photos.length ? photosBtn(p.url, md) : null,

        el("div", { class: "meta" }, streamMeta(first), " · ", t("ui.caught")),

  }

    el("div", { class: "item no-check" },
      el("span", { class: "num" }, i + 1),
      el("span", { class: "name", title: st.url }, streamMeta(st)),
      el("span", { class: "status", title: st.referer ? t("ui.played_on", { page: st.referer }) : "" }, new URL(st.url).hostname),
      el("span", {}, ...buttons(st, "")))));
  return el("div", { class: "card preview" }, thumb(first.thumbnail || md.thumbnail),
    el("div", {},
      el("div", { class: "title" }, md.title || p.url),
      el("div", { class: "meta" }, t("ui.streams_caught", { count: streams.length })),
      el("div", { class: "actions" }, ...buttons(first, "primary"), ...more, dismissBtn)),
    list);
}

async function startPlaylist(key, audio) {
  const p = state.previews.get(key), md = p.md;
  const items = md.entries.filter((e) => p.selected.has(e.index))
    .map((e) => ({ index: e.index, url: e.url, title: e.title, thumbnail: e.thumbnail, referer: e.referer, origin: e.origin, page: e.page }));
  if (!items.length) return;
  dismiss(key);
  try {
    const jobs = await api("/api/download-playlist", { method: "POST", body: { title: md.title, total: md.entries.length, audio, items } });
    for (const j of jobs) state.jobs.set(j.id, j);
    renderJobs();
  } catch (e) { alert(e.message); }
}

async function startPhotos(key) {
  const p = state.previews.get(key), md = p.md;
  const items = md.photos.filter((ph) => p.selected.has(ph.index));
  if (!items.length) return;
  dismiss(key);
  try {
    upsertJob(await api("/api/download-photos", { method: "POST", body: {
      url: p.url, title: md.title, source: md.source, total: md.photos.length, truncated: md.truncated, items } }));
  } catch (e) { alert(e.message); }
}

function previewCard(key, p) {
  const url = p.url;
  if (p.status === "loading" && p.mode === "links") {
    p.bar = el("div", { style: "width: 0%" });
    p.count = el("span", {}, t("ui.links_checked", { done: 0, total: p.links.length }));
    return el("div", { class: "card preview" }, thumb(),
      el("div", {}, el("div", { class: "title" }, t("ui.checking_links", { count: p.links.length })),
        el("div", { class: "meta" }, p.title || url, " · ", p.count),
        el("div", { class: "bar" }, p.bar),
        el("div", { class: "actions" }, el("button", { type: "button", onclick: () => dismiss(key) }, t("ui.dismiss")))));
  }
  if (p.status === "loading") {
    return el("div", { class: "card preview" }, thumb(),
      el("div", {}, el("div", { class: "title" }, p.mode === "crow" ? t("ui.looking_crow") : p.photos ? t("ui.looking_photos") : t("ui.looking")),
        el("div", { class: "meta" }, p.mode === "crow" ? t("ui.loading_hidden", { url }) : url),
        signInWaiting() ? el("div", { class: "meta" }, t("ui.signin_waiting")) : null,
        el("div", { class: "bar indeterminate" }, el("div")),
        el("div", { class: "actions" }, el("button", { type: "button", onclick: () => dismiss(key) }, t("ui.dismiss")))));
  }
  if (p.status === "error") {
    return el("div", { class: "card" },
      el("div", { class: "meta" }, url), problemView(p.problem, p.error), signInHint(p.problem, url), updateHint(p.problem),
      el("div", { class: "actions" },
        el("button", { type: "button", onclick: () => { dismiss(key); p.mode === "links" ? checkLinks(url, { links: p.links, title: p.title }) : inspect(url, p.mode); } }, t("ui.retry")),
        p.photos ? null : el("button", { type: "button", onclick: () => { dismiss(key); inspect(url, "photos"); }, title: t("ui.photos_instead_tip") }, t("ui.photos_instead")),

      el("div", {},
        el("div", { class: "title" }, md.title || url),

      el("div", { class: "title" }, md.title || url),

      el("div", { class: "actions" },
        el("button", { class: "primary", type: "button", onclick: () => startDownload(key, false) }, t("ui.salvage_video")),

        md.playlist_url ? el("button", { type: "button", onclick: () => inspect(md.playlist_url) }, t("ui.whole_playlist")) : null,
        el("button", { class: "link", type: "button", onclick: () => inspect(url, "photos"), title: t("ui.photos_instead_tip") }, t("ui.photos_instead")),
        el("button", { class: "link", type: "button", onclick: () => dismiss(key) }, t("ui.dismiss")))));

function playlistCard(key, p) {
  const md = p.md, n = md.entries.length;
  const videoBtn = el("button", { class: "primary", type: "button", onclick: () => startPlaylist(key, false) });
  const audioBtn = el("button", { type: "button", onclick: () => startPlaylist(key, true) });
  const chooseBtn = el("button", { class: "link", type: "button" });
  const checks = [];
  const refresh = () => {
    const k = p.selected.size;
    videoBtn.textContent = k === n ? t("ui.salvage_all", { count: n }) : t("ui.salvage_some", { count: k, total: n });
    audioBtn.textContent = t("ui.salvage_audio", { format: audioLabel() });
    videoBtn.disabled = audioBtn.disabled = k === 0;
    chooseBtn.textContent = p.expanded ? t("ui.hide_items") : t("ui.choose_items");
    list.hidden = !p.expanded;
  };
  const setAll = (on) => {
    p.selected = new Set(on ? md.entries.map((e) => e.index) : []);
    checks.forEach((c) => { c.checked = on; });
    refresh();
  };
  // Thumbnails, when the playlist has them, open large on click.
  const withThumbs = md.entries.filter((e) => e.thumbnail);
  const big = withThumbs.map((e) => ({ src: imgSrc(e.thumbnail, e.page || md.url), title: e.title, detail: e.duration ? e.duration_string : "" }));
  const rowThumb = (e) => {
    if (!e.thumbnail) return el("span", { class: "row-thumb" });
    const img = el("img", { class: "row-thumb", alt: "", loading: "lazy", referrerpolicy: "no-referrer", src: imgSrc(e.thumbnail, e.page || md.url),
      title: t("ui.enlarge"), onclick: enlarge(big, withThumbs.indexOf(e)) });
    img.addEventListener("error", () => img.replaceWith(el("span", { class: "row-thumb" })));
    return img;
  };
  const list = el("div", { class: "items" },
    el("div", { class: "items-head" }, t("ui.select"),
      el("button", { class: "link", type: "button", onclick: () => setAll(true) }, t("ui.select_all")),
      el("button", { class: "link", type: "button", onclick: () => setAll(false) }, t("ui.select_none"))),
    md.entries.map((e) => {
      const cb = el("input", { type: "checkbox", checked: p.selected.has(e.index), "aria-label": e.title });
      cb.addEventListener("change", () => { cb.checked ? p.selected.add(e.index) : p.selected.delete(e.index); refresh(); });
      checks.push(cb);
      return el("label", { class: withThumbs.length ? "item with-thumb" : "item" }, cb,
        el("span", { class: "num" }, e.index),
        withThumbs.length ? rowThumb(e) : null,
        el("span", { class: "name", title: e.title }, e.title),
        el("span", { class: "status" }, e.duration ? e.duration_string : ""));
    }));
  chooseBtn.addEventListener("click", () => { p.expanded = !p.expanded; refresh(); });
  refresh();
  const meta = [md.uploader, t("ui.items", { count: n })].filter(Boolean).join(" · ");
  return el("div", { class: "card preview" }, thumb(md.thumbnail),
    el("div", {},
      el("div", { class: "title" }, md.title || p.url),
      el("div", { class: "meta" }, (md.source === "links" ? t("ui.linked_from_page") : t("ui.playlist")) + " · ", meta),
      el("div", { class: "actions" }, videoBtn, audioBtn, chooseBtn,
        el("button", { class: "link", type: "button", onclick: () => dismiss(key) }, t("ui.dismiss")))),
    list);
}

// The photo picker is a grid of tiles; images load lazily as it scrolls.
function photosCard(key, p) {
  const md = p.md, n = md.photos.length, page = md.url || p.url;
  const saveBtn = el("button", { class: "primary", type: "button", onclick: () => startPhotos(key) });
  const chooseBtn = el("button", { class: "link", type: "button" });
  const tiles = [];
  const refresh = () => {
    const k = p.selected.size;
    saveBtn.textContent = k === n ? t("ui.salvage_all", { count: md.truncated ? `${n}+` : n }) : t("ui.salvage_some", { count: k, total: n });
    saveBtn.disabled = k === 0;
    chooseBtn.textContent = p.expanded ? t("ui.hide_photos") : t("ui.choose_photos");
    picker.hidden = !p.expanded;
  };
  const setOne = (ph, tile, on) => {
    on ? p.selected.add(ph.index) : p.selected.delete(ph.index);
    tile.classList.toggle("on", on);
    tile.querySelector("input").checked = on;
  };
  const setAll = (on) => { md.photos.forEach((ph, i) => setOne(ph, tiles[i], on)); refresh(); };
  const stills = md.photos.filter((ph) => !ph.video);
  const big = stills.map((ph) => ({ src: imgSrc(ph.url, page), title: ph.name || t("ui.photo_n", { index: ph.index }), detail: ph.width ? `${ph.width}×${ph.height}` : "" }));
  const grid = el("div", { class: "photo-grid" }, md.photos.map((ph) => {
    const cb = el("input", { type: "checkbox", checked: p.selected.has(ph.index), "aria-label": ph.name || t("ui.photo_n", { index: ph.index }) });
    const caption = [ph.index, ph.width ? `${ph.width}×${ph.height}` : ""].filter(Boolean).join(" · ");
    const tile = el("label", { class: "tile" + (p.selected.has(ph.index) ? " on" : ""), title: ph.name || ph.url },
      ph.video ? el("span", { class: "video" }, t("ui.video_tile")) : thumb(ph.thumb || ph.url, page), cb,
      ph.video ? null : el("button", { class: "zoom", type: "button", "aria-label": t("ui.enlarge"), title: t("ui.enlarge"), onclick: enlarge(big, stills.indexOf(ph)) }, "⤢"),
      el("span", { class: "cap" }, caption));
    cb.addEventListener("change", () => { setOne(ph, tile, cb.checked); refresh(); });
    tiles.push(tile);
    return tile;
  }));
  const picker = el("div", { class: "photos" },
    el("div", { class: "items-head" }, t("ui.select"),
      el("button", { class: "link", type: "button", onclick: () => setAll(true) }, t("ui.select_all")),
      el("button", { class: "link", type: "button", onclick: () => setAll(false) }, t("ui.select_none"))),
    grid);
  chooseBtn.addEventListener("click", () => { p.expanded = !p.expanded; refresh(); });
  refresh();
  const found = md.truncated ? t("ui.photos_more", { count: n }) : t("ui.kind_photos", { count: n });
  const via = { page: t("ui.via_page"), browser: t("ui.via_browser"), "gallery-dl": t("ui.via_gallery_dl") }[md.source];
  const meta = [md.uploader, found, via].filter(Boolean).join(" · ");
  return el("div", { class: "card preview" }, thumb(md.thumbnail, page),
    el("div", {},
      el("div", { class: "title" }, md.title || p.url),
      el("div", { class: "meta" }, t("ui.photos") + " · ", meta),
      md.truncated ? el("div", { class: "meta" }, t("ui.showing_first", { count: n })) : null,
      el("div", { class: "actions" }, saveBtn, chooseBtn,
        md.streams && md.streams.length ? streamsBtn(p.url, md, "link") : null,
        md.links && md.links.length ? linkedBtn(p.url, md, "link") : null,
        md.source === "browser" ? null : crowsNestBtn(p.url, "link"),
        el("button", { class: "link", type: "button", onclick: () => dismiss(key) }, t("ui.dismiss")))),
    picker);
}

function renderPreviews() {
  $("previews").replaceChildren(...[...state.previews].reverse().map(([key, p]) => {
    if (!p.el || p.elStatus !== p.status) { p.el = previewCard(key, p); p.elStatus = p.status; }
    return p.el;
  }));
}

// ---- jobs ----
// Progress events arrive several times a second per job; coalesce re-renders.
let renderQueued = false;
function upsertJob(job) {
  state.jobs.set(job.id, job);
  if (!renderQueued) { renderQueued = true; setTimeout(() => { renderQueued = false; renderJobs(); }, 150); }
}

const post = (path) => api(path, { method: "POST" }).catch((e) => alert(e.message));
const isActive = (j) => !["done", "error", "canceled"].includes(j.state);
const fileName = (p) => p.split(/[\\/]/).pop();

function photoLine(j) {
  const files = j.files || 0;
  switch (j.state) {
    case "queued": return t("ui.waiting_slot");
    case "downloading": return [j.file_total ? t("ui.photos_progress", { count: files, total: j.file_total }) : t("ui.kind_photos", { count: files }),
      j.downloaded && fmtBytes(j.downloaded)].filter(Boolean).join(" · ");
    case "done": return t("ui.photos_saved", { count: files });
    default: return !files ? "" : j.file_total ? t("ui.photos_saved_of", { count: files, total: j.file_total }) : t("ui.photos_saved", { count: files });
  }
}

function jobLine(j) {
  if (j.kind === "photos") return photoLine(j);
  switch (j.state) {
    case "queued": return t("ui.waiting_slot");
    case "processing": return j.audio ? t("ui.converting_audio") : t("ui.processing");
    case "downloading": {
      const parts = [j.total ? t("ui.bytes_of", { done: fmtBytes(j.downloaded), total: fmtBytes(j.total) }) : fmtBytes(j.downloaded)];
      if (j.speed) parts.push(t("ui.per_second", { size: fmtBytes(j.speed) }));
      if (j.eta) parts.push(t("ui.time_left", { time: fmtEta(j.eta) }));
      if (j.part > 1) parts.push(t("ui.part", { n: j.part }));
      return parts.filter(Boolean).join(" · ");
    }
    case "done": return j.file_path ? fileName(j.file_path) : t("ui.done");
    default: return ""; // canceled/error: the badge says it
  }
}

function progressBar(state, percent) {
  const bar = el("div", { class: "bar" + (state === "queued" || state === "processing" ? " indeterminate" : "") + (state === "done" ? " done" : "") }, el("div"));
  if (state === "downloading" || state === "done") bar.firstChild.style.width = `${Math.min(100, state === "done" ? 100 : percent)}%`;
  return bar;
}

function jobActions(j, small) {
  const b = (label, onclick) => el("button", { type: "button", onclick }, label);
  return [
    isActive(j) ? b(t("ui.cancel"), () => post(`/api/jobs/${j.id}/cancel`)) : null,
    (j.state === "done" || (j.kind === "photos" && j.files)) && j.file_path ? b(t("ui.show"), () => post(`/api/jobs/${j.id}/reveal`)) : null,
    (j.state === "error" || j.state === "canceled") ? b(t("ui.retry"), () => post(`/api/jobs/${j.id}/retry`)) : null,
  ].filter(Boolean).slice(0, small ? 1 : 3);
}

function jobCard(j) {
  // A photo job with an unknown total (a huge gallery) shows a moving bar and a count.
  const unknownTotal = j.kind === "photos" && !j.file_total;
  const badgeText = { queued: t("ui.state_queued"), downloading: unknownTotal ? t("ui.state_salvaging") : fmtPercent(j.percent),
    processing: t("ui.state_processing"), done: t("ui.done"), error: t("ui.state_failed"), canceled: t("ui.state_canceled") }[j.state];
  const tag = j.audio ? `  · ${t("ui.tag_audio")}` : j.kind === "photos" ? `  · ${t("ui.tag_photos")}` : "";
  return el("div", { class: "card job" }, thumb(j.thumbnail, j.kind === "photos" ? j.url : j.page),
    el("div", { style: "min-width:0" },
      el("div", { class: "title" }, j.title, tag ? el("span", { class: "meta" }, tag) : null),
      (isActive(j) || j.state === "done") ? progressBar(unknownTotal && j.state === "downloading" ? "processing" : j.state, j.percent) : null,
      el("div", { class: "meta" }, el("span", { class: `badge ${j.state}` }, badgeText), "  ", jobLine(j)),
      j.state === "error" ? problemView(j.problem, j.error) : null,
      j.state === "error" ? signInHint(j.problem, j.page || j.url) : null,
      j.state === "error" ? updateHint(j.problem) : null),
    el("div", { class: "job-actions actions" }, jobActions(j)));
}

function itemStatus(j) {
  switch (j.state) {
    case "downloading": return fmtPercent(j.percent);
    case "queued": return t("ui.item_queued");
    case "processing": return t("ui.item_processing");
    case "done": return t("ui.item_done");
    case "error": return t("ui.item_failed");
    case "canceled": return t("ui.item_canceled");
    default: return j.state;
  }
}

function groupCard(id, jobs) {
  jobs.sort((a, b) => a.index - b.index);
  const first = jobs[0], n = jobs.length;
  const count = (s) => jobs.filter((j) => j.state === s).length;
  const done = count("done"), failed = count("error"), canceled = count("canceled");
  const active = jobs.filter(isActive);
  const running = jobs.filter((j) => j.state === "downloading" || j.state === "processing").length;
  // Unfinished items count as at most 99% so the group never reads 100% early.
  const percent = jobs.reduce((sum, j) => sum + (j.state === "done" ? 100 : isActive(j) ? Math.min(j.percent, 99) : 0), 0) / n;
  const overall = active.length ? (running ? "downloading" : "queued") : "done";

  const summary = [
    t("ui.group_done", { count: done, total: n }),
    running && t("ui.group_downloading", { count: running }),
    failed && t("ui.group_failed", { count: failed }),
    canceled && t("ui.group_canceled", { count: canceled }),
  ].filter(Boolean).join(" · ");
  const expanded = state.expandedGroups.has(id);
  const toggle = () => { expanded ? state.expandedGroups.delete(id) : state.expandedGroups.add(id); renderJobs(); };
  const firstDone = jobs.find((j) => j.state === "done" && j.file_path);
  const b = (label, onclick, cls) => el("button", { type: "button", class: cls, onclick }, label);
  const pic = jobs.find((j) => j.thumbnail) || first;

  return el("div", { class: "card job" }, thumb(pic.thumbnail, pic.page),
    el("div", { style: "min-width:0" },
      el("div", { class: "title" }, first.group_title, el("span", { class: "meta" }, `  · ${t("ui.items", { count: n })}${first.audio ? ` · ${t("ui.tag_audio")}` : ""}`)),
      // Finished with errors: show how much actually completed.
      overall === "done" && (failed || canceled) ? progressBar("downloading", (done / n) * 100) : progressBar(overall, percent),
      el("div", { class: "meta" },
        el("span", { class: `badge ${active.length ? "" : failed ? "error" : "done"}` }, active.length ? fmtPercent(percent) : failed ? t("ui.finished_errors") : t("ui.done")),
        "  ", summary),
      failed && !active.length ? updateHint() : null),
    el("div", { class: "job-actions actions" },
      active.length ? b(t("ui.cancel_all"), () => post(`/api/groups/${id}/cancel`)) : null,
      (failed || canceled) ? b(t("ui.retry_failed"), () => jobs.filter((j) => j.state === "error" || j.state === "canceled").forEach((j) => post(`/api/jobs/${j.id}/retry`))) : null,
      firstDone ? b(t("ui.show"), () => post(`/api/jobs/${firstDone.id}/reveal`)) : null,
      b(expanded ? t("ui.hide_items") : t("ui.items_button"), toggle, "link")),
    expanded ? el("div", { class: "items", "data-group": id }, jobs.map((j) =>
      el("div", { class: "item no-check", title: j.state === "error" ? (j.problem ? problemText(j.problem) : j.error) : j.title },
        el("span", { class: "num" }, j.index),
        el("span", { class: "name" }, j.title),
        el("span", { class: `status ${j.state}` }, itemStatus(j)),
        el("span", {}, jobActions(j, true))))) : null);
}

function renderJobs() {
  const box = $("jobs");
  if (!state.jobs.size) { box.replaceChildren(el("div", { class: "empty" }, t("ui.nothing_yet"))); renderUpdate(); return; }
  // Single jobs and playlist groups, newest first; a group sorts by its first item.
  const groups = new Map(), cards = [];
  for (const j of state.jobs.values()) {
    if (!j.group) { cards.push({ created: j.created, render: () => jobCard(j) }); continue; }
    if (!groups.has(j.group)) groups.set(j.group, []);
    groups.get(j.group).push(j);
  }
  for (const [id, jobs] of groups) {
    const created = jobs.reduce((min, j) => (j.created < min ? j.created : min), jobs[0].created);
    cards.push({ created, render: () => groupCard(id, jobs) });
  }
  cards.sort((a, b) => b.created.localeCompare(a.created));
  const scroll = new Map([...box.querySelectorAll(".items")].map((n) => [n.dataset.group, n.scrollTop]));
  box.replaceChildren(...cards.map((c) => c.render()));
  renderUpdate(); // the post-update banner counts failed downloads
  for (const n of box.querySelectorAll(".items")) if (scroll.has(n.dataset.group)) n.scrollTop = scroll.get(n.dataset.group);
}

// ---- settings ----
function fillSelect(sel, options, value, labels = {}) {
  sel.replaceChildren(...options.map((o) => el("option", { value: o, selected: o === value }, labels[o] || o)));
}

let meta = {};
function openSettings() {
  const s = state.settings;
  $("s-out").value = s.output_dir;
  fillSelect($("s-quality"), meta.video_qualities, s.video_quality, { best: t("ui.quality_best"), 2160: "4K (2160p)", 1440: "1440p", 1080: "1080p", 720: "720p", 480: "480p" });
  $("s-compat").checked = s.compatible_mp4;
  fillSelect($("s-audio"), meta.audio_formats, s.audio_format);
  const detected = new Set(meta.browsers);
  const browsers = ["", ...meta.supported_browsers.filter((b) => detected.has(b)), "whydah", ...meta.supported_browsers.filter((b) => !detected.has(b))];
  const labels = { "": t("ui.cookies_none"), whydah: t("ui.cookies_own") };
  for (const b of meta.supported_browsers) {
    const name = b[0].toUpperCase() + b.slice(1);
    labels[b] = detected.has(b) ? name : t("ui.not_detected", { browser: name });
  }
  fillSelect($("s-browser"), browsers, s.browser_cookies, labels);
  $("s-signin-error").textContent = "";
  renderSignIn();
  $("s-conc").value = s.max_concurrent;
  $("s-clip").checked = s.watch_clipboard;
  $("s-hosts").value = s.supported_hosts.join(", ");
  $("s-channel").value = s.update_channel;
  const autoName = (i18n.languages.find((l) => l.code === i18n.auto) || {}).name || i18n.auto;
  const langLabels = { "": t("ui.language_auto", { name: autoName }) };
  for (const l of i18n.languages) langLabels[l.code] = l.name;
  fillSelect($("s-lang"), ["", ...i18n.languages.map((l) => l.code)], s.language, langLabels);
  $("s-names").value = s.name_template;
  $("s-names").placeholder = "{title}";
  showNameExample();
  $("s-bookmarklet").href = bookmarklet();
  $("s-error").textContent = "";
  $("settings").showModal();
}

async function saveSettings(ev) {
  ev.preventDefault();
  const body = {
    output_dir: $("s-out").value,
    video_quality: $("s-quality").value,
    compatible_mp4: $("s-compat").checked,
    audio_format: $("s-audio").value,
    browser_cookies: $("s-browser").value,
    max_concurrent: parseInt($("s-conc").value, 10) || 1,
    watch_clipboard: $("s-clip").checked,
    supported_hosts: $("s-hosts").value.split(",").map((h) => h.trim()).filter(Boolean),
    update_channel: $("s-channel").value,
    language: $("s-lang").value,
    name_template: $("s-names").value.trim(),
  };
  try {
    const langChanged = body.language !== state.settings.language;
    state.settings = await api("/api/settings", { method: "PUT", body });
    if (langChanged) { await loadMessages(); renderJobs(); }
    for (const p of state.previews.values()) p.el = null; // labels show the audio format
    renderClipHint(); renderPreviews();
    $("settings").close();
  } catch (e) { $("s-error").textContent = e.problem ? problemText(e.problem) : e.message; }
}

// ---- sign-in browser ----
// Whydah's own browser profile, for sites that don't keep you signed in with
// borrowed cookies. Its controls show when it's the cookie source chosen.
function renderSignIn() {
  const si = state.signin || {};
  $("s-signin").hidden = $("s-browser").value !== "whydah";
  $("s-signin-hint").textContent = si.browser ? t("ui.signin_hint", { browser: si.browser }) : t("error.signin_no_browser");
  $("s-signin-open").disabled = !si.browser;
  $("s-signout").disabled = !si.profile || si.open;
  $("s-signin-status").textContent = si.open ? t("ui.signin_open") : "";
}

// signInWaiting reports whether looks wait for the sign-in window to close.
const signInWaiting = () => !!(state.signin && state.signin.open && state.settings && state.settings.browser_cookies === "whydah");

function signInFailed(e) {
  const msg = e.problem ? problemText(e.problem) : e.message;
  if ($("settings").open) $("s-signin-error").textContent = msg;
  else alert(msg);
}

// signIn opens the sign-in window, at url if given.
async function signIn(url = "") {
  $("s-signin-error").textContent = "";
  try { state.signin = await api("/api/signin", { method: "POST", body: { url } }); renderSignIn(); }
  catch (e) { signInFailed(e); }
}

async function signOut() {
  if (!confirm(t("ui.signout_confirm"))) return;
  $("s-signin-error").textContent = "";
  try { state.signin = await api("/api/signout", { method: "POST" }); renderSignIn(); }
  catch (e) { signInFailed(e); }
}

// signInHint offers to sign in to a failed page's site, when the sign-in
// browser's cookies are the ones used.
const signInHints = new Set(["hint.cookies_own", "hint.forbidden_own"]);
function signInHint(problem, url) {
  if (!problem || !signInHints.has(problem.hint) || !url) return null;
  return el("div", { class: "actions" },
    el("button", { type: "button", onclick: () => signIn(url) }, t("ui.signin_site", { site: (problem.args || {}).site || url })));
}

// showNameExample shows what the file name template makes of an example video.
const nameSample = { title: "Harbour Lights", uploader: "Sea Films", date: "2026-10-25", site: "example.com", id: "48213" };
function showNameExample() {
  const tmpl = $("s-names").value.trim() || "{title}";
  const name = tmpl.replace(/\{(\w+)\}/g, (m, k) => nameSample[k] ?? m) + ".mp4";
  $("s-names-example").replaceChildren(t("ui.names_example", { tokens: (meta.name_tokens || []).map((k) => `{${k}}`).join(" ") }) + " ", el("code", {}, name));
}

// bookmarklet is a link that, run on any page, opens it in Whydah: this
// tab if it's open (by window name), else a new one. The key goes after
// "#", which browsers never send anywhere, so other sites can't use it.
function bookmarklet() {
  const base = `${location.origin}/#t=${encodeURIComponent(token)}&url=`;
  return `javascript:void window.open(${JSON.stringify(base)}+encodeURIComponent(location.href),"whydah")`;
}

// takeLinkFromAddress inspects a link the bookmarklet passed in the address, then tidies the address.
function takeLinkFromAddress() {
  const u = new URLSearchParams(location.hash.slice(1)).get("url");
  if (!u) return;
  history.replaceState(null, "", `#t=${encodeURIComponent(token)}`);
  inspect(u);
}

let historyTimer;

    const again = e.page || e.url;
    return el("div", { class: "past" },
      e.kind === "photos" && !e.thumbnail ? el("div", { class: "thumb" }) : thumb(e.thumbnail),

        el("div", { class: "name", title: e.title }, e.title),

        el("button", { type: "button", title: again, onclick: () => { $("history").close(); inspect(again); } }, t("ui.salvage_again")),
        el("button", { type: "button", class: "link", title: t("ui.history_forget"), "aria-label": t("ui.history_forget"),

function renderClipHint() {
  $("clip-hint").textContent = state.settings && state.settings.watch_clipboard
    ? t("ui.clip_on")
    : t("ui.clip_off");

// ---- wiring ----
let pageVersion = null; // the version of Whydah this page came from
async function loadState() {
  const s = await api("/api/state");
  if (pageVersion && s.version !== pageVersion) { location.reload(); return; } // updated: get its page
  pageVersion = s.version;
  meta = s; state.settings = s.settings; state.tools = s.tools; state.signin = s.signin; state.self = s.self_update;
  state.jobs = new Map(s.jobs.map((j) => [j.id, j]));
  renderTools(); renderJobs(); renderClipHint();
}

function connect() {
  const es = new EventSource(`/api/events?t=${encodeURIComponent(token)}`);
  es.onopen = () => loadState().catch(() => {}); // resync anything missed while disconnected
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "job_updated") upsertJob(ev.data);
    else if (ev.type === "tools_status") {
      const was = state.tools && state.tools.update && state.tools.update.available;
      state.tools = ev.data; renderTools();
      if (was !== state.tools.update.available) { // failure cards show an update hint
        for (const p of state.previews.values()) if (p.status === "error") p.el = null;
        renderPreviews(); renderJobs();
      }
    }
    else if (ev.type === "url_detected") inspect(ev.data.url);
    else if (ev.type === "links_progress") linksProgress(ev.data);
    else if (ev.type === "self_update") { state.self = ev.data; renderSelfUpdate(); }
    else if (ev.type === "signin_status") {
      state.signin = ev.data; renderSignIn();
      for (const p of state.previews.values()) if (p.status === "loading" && p.mode !== "links") p.el = null; // the waiting note
      renderPreviews();
    }
  };
}

$("s-signin-open").addEventListener("click", () => signIn());
$("s-signout").addEventListener("click", signOut);
$("s-bookmarklet").addEventListener("click", (ev) => { ev.preventDefault(); alert(t("ui.bookmarklet_hint")); });
$("open-history").addEventListener("click", () => {
  $("history-q").placeholder = t("ui.history_search");
  $("history").showModal();
  showHistory().catch((e) => { $("history-count").textContent = e.message; });
});
$("history-q").addEventListener("input", () => { clearTimeout(historyTimer); historyTimer = setTimeout(() => showHistory().catch(() => {}), 150); });
$("history-close").addEventListener("click", () => $("history").close());
$("history-clear").addEventListener("click", async () => {
  if (!confirm(t("ui.history_clear_confirm"))) return;
  await api("/api/history/forget", { method: "POST" });
  showHistory();
});
window.addEventListener("hashchange", takeLinkFromAddress);
$("settings-form").addEventListener("submit", saveSettings);
$("s-cancel").addEventListener("click", () => $("settings").close());
$("open-folder").addEventListener("click", () => api("/api/open-folder", { method: "POST" }).catch((e) => alert(e.message)));
$("clear").addEventListener("click", async () => {
  const jobs = await api("/api/jobs/clear", { method: "POST" });
  state.jobs = new Map(jobs.map((j) => [j.id, j])); renderJobs();
});
$("quit").addEventListener("click", async () => {
  if (!confirm(t("ui.quit_confirm"))) return;
  await api("/api/quit", { method: "POST" }).catch(() => {});
  document.body.replaceChildren(el("main", {}, el("p", { class: "hint" }, t("ui.quit_done"))));
});

if (!token) {
  $("tools-banner").hidden = false; $("tools-banner").classList.add("error");
  $("tools-banner").textContent = "This page needs to be opened from the app. Run Whydah again to get a working link.";
  loadMessages().then(() => { $("tools-banner").textContent = t("ui.no_token"); }).catch(() => {});
} else {
  loadMessages().catch(() => {}) // without them failures show their keys; everything else still works
    .then(() => loadState())
    .then(() => takeLinkFromAddress())
    .catch((e) => { $("tools-banner").hidden = false; $("tools-banner").textContent = e.message; });
  connect();
}
</script>
</body>
</html>
